name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate OpenSpec
        run: npx --yes @fission-ai/openspec@1.4.1 validate --all --strict
