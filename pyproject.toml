[project]
name = "aiengineering-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.17.0",
    "fastapi>=0.157.0",
    "openai>=3.35.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
